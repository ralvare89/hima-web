<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <title>Favicon Preview</title>
  <style>
    body { background: #333; display: flex; align-items: center; justify-content: center; gap: 40px; min-height: 100vh; margin: 0; flex-wrap: wrap; font-family: sans-serif; }
    .item { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .label { color: #aaa; font-size: 12px; }
    img { image-rendering: pixelated; }
  </style>
</head>
<body>
  <div class="item">
    <img src="/favicon-source.svg" width="128" height="128"/>
    <span class="label">128 × 128</span>
  </div>
  <div class="item">
    <img src="/favicon-source.svg" width="64" height="64"/>
    <span class="label">64 × 64</span>
  </div>
  <div class="item">
    <img src="/favicon-source.svg" width="32" height="32"/>
    <span class="label">32 × 32</span>
  </div>
  <div class="item">
    <img src="/favicon-source.svg" width="16" height="16"/>
    <span class="label">16 × 16</span>
  </div>
</body>
</html>
